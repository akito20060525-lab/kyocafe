<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>きょうのカフェ診断</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');
    body { font-family: 'Noto Sans JP', sans-serif; }
    .fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-amber-50/50 text-slate-800 min-h-screen pb-12">

  <!-- Header -->
  <header class="bg-white border-b border-amber-100 sticky top-0 z-10 shadow-sm">
    <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="bg-amber-700 text-white p-2 rounded-xl text-lg flex items-center justify-center">
          <i class="fa-solid fa-mug-hot"></i>
        </div>
        <h1 class="font-bold text-lg text-slate-800 tracking-tight">きょうのカフェ診断</h1>
      </div>
      <span class="text-xs font-semibold bg-amber-100 text-amber-800 px-2.5 py-1 rounded-full">プロトタイプ</span>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 mt-4">

    <!-- Step Indicator -->
    <div id="step-indicator" class="flex justify-between items-center mb-6 px-2">
      <div class="flex items-center gap-1.5">
        <span id="dot-1" class="w-3 h-3 rounded-full bg-amber-600 transition-all"></span>
        <span id="dot-2" class="w-3 h-3 rounded-full bg-slate-200 transition-all"></span>
        <span id="dot-3" class="w-3 h-3 rounded-full bg-slate-200 transition-all"></span>
      </div>
      <span id="step-text" class="text-xs font-medium text-slate-500">質問 1 / 3</span>
    </div>

    <!-- Question View -->
    <div id="question-container" class="bg-white rounded-2xl p-6 shadow-sm border border-amber-100/60 fade-in">
      <button id="btn-prev" onclick="goBack()" class="hidden -mt-2 mb-3 text-xs font-medium text-slate-500 hover:text-amber-800 flex items-center gap-1">
        <i class="fa-solid fa-chevron-left text-[10px]"></i>前の質問に戻る
      </button>
      <h2 id="question-title" class="text-lg font-bold text-slate-800 mb-1">今どんな目的で使いたい？</h2>
      <p id="question-sub" class="text-xs text-slate-500 mb-6">直感で1つ選んでね</p>

      <div id="options-grid" class="grid gap-3">
        <!-- Options rendered dynamically -->
      </div>
    </div>

    <!-- Result View (Hidden initially) -->
    <div id="result-container" class="hidden fade-in">

      <!-- Top banner -->
      <div class="bg-gradient-to-r from-amber-800 to-amber-700 text-white rounded-2xl p-5 mb-4 shadow-md">
        <div class="flex items-center justify-between mb-1">
          <span class="text-xs font-medium bg-white/20 px-2.5 py-0.5 rounded-full text-amber-50">診断結果</span>
          <button onclick="resetQuiz()" class="text-xs text-amber-100 underline hover:text-white flex items-center gap-1">
            <i class="fa-solid fa-rotate-left"></i>やり直す
          </button>
        </div>
        <h2 id="result-headline" class="text-lg font-bold mt-1">あなたにぴったりなおすすめカフェ</h2>
        <p id="result-sub" class="text-xs text-amber-100 mt-1">条件にあうベスト3を表示中</p>
      </div>

      <!-- Sort Buttons (Responsive Scrollable) -->
      <div class="flex items-center justify-between mb-3 bg-white p-1.5 rounded-xl border border-amber-100 text-xs overflow-x-auto no-scrollbar gap-2">
        <span class="text-slate-500 pl-2 font-medium shrink-0">並び替え:</span>
        <div class="flex gap-1 shrink-0">
          <button id="sort-recommend" onclick="sortResults('recommend')" class="px-2.5 py-1 rounded-lg font-medium bg-amber-100 text-amber-900 transition-all whitespace-nowrap">おすすめ順</button>
          <button id="sort-rating" onclick="sortResults('rating')" class="px-2.5 py-1 rounded-lg font-medium text-slate-600 hover:bg-slate-100 transition-all whitespace-nowrap">評価が高い順</button>
          <button id="sort-seats" onclick="sortResults('seats')" class="px-2.5 py-1 rounded-lg font-medium text-slate-600 hover:bg-slate-100 transition-all whitespace-nowrap">席数が多い順</button>
        </div>
      </div>

      <!-- Cafe List -->
      <div id="cafe-list" class="grid gap-4">
        <!-- Cafe cards rendered dynamically -->
      </div>

      <div class="mt-6 text-center text-xs text-slate-400">
        <p>※ 実験用プロトタイプのため架空の店舗データを表示しています</p>
      </div>
    </div>

  </main>

  <!-- Modal -->
  <div id="modal" class="fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center hidden p-0 sm:p-4">
    <div id="modal-content" class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl max-h-[90vh] overflow-y-auto p-6 relative fade-in" onclick="event.stopPropagation()">
      <!-- Modal contents dynamically filled -->
    </div>
  </div>

  <script>
    // --- Master Data ---
    const questions = [
      {
        id: "purpose",
        title: "今どんな目的で使いたい？",
        sub: "メインの用途を選んでね",
        options: [
          { label: "パソコン作業・勉強", icon: "fa-laptop", value: "work" },
          { label: "サクッと1人でお茶・休憩", icon: "fa-mug-saucer", value: "quick" },
          { label: "友達とおしゃべり", icon: "fa-comments", value: "chat" },
          { label: "デート", icon: "fa-heart", value: "date" }
        ]
      },
      {
        id: "time",
        title: "滞在時間の予定は？",
        sub: "およその目安でOK",
        options: [
          { label: "30分以内でサクッと", icon: "fa-bolt", value: "express" },
          { label: "30分〜1時間", icon: "fa-mug-saucer", value: "short" },
          { label: "1〜2時間程度", icon: "fa-clock", value: "medium" },
          { label: "2時間以上じっくり", icon: "fa-hourglass-half", value: "long" }
        ]
      },
      {
        id: "atmosphere",
        title: "重視したいこだわりは？",
        sub: "一番譲れないポイント",
        options: [
          { label: "静かさ・集中しやすさ", icon: "fa-volume-xmark", value: "quiet" },
          { label: "入りやすさ・手軽さ", icon: "fa-door-open", value: "easy" },
          { label: "おしゃれさ・雰囲気の良さ", icon: "fa-wand-magic-sparkles", value: "fancy" },
          { label: "スイーツ・フードの充実", icon: "fa-cake-candles", value: "food" }
        ]
      }
    ];

    // 架空の店舗データ（6店舗）
    const cafes = [
      {
        id: 1,
        name: "渋谷ウッドテラスカフェ",
        area: "渋谷駅 徒歩3分",
        rating: 4.4,
        totalSeats: 65,
        seatsDetail: "カウンター25席 / テーブル40席",
        plug: true,
        wifi: true,
        tags: ["電源充実", "静かめ", "作業向け"],
        img: "https://images.unsplash.com/photo-1554118811-1e0d58224f24?auto=format&fit=crop&w=600&q=80",
        fitReason: "静かな空間と電源環境で作業に集中できます",
        crowdText: "カウンター席中心 / PC作業のお客さまが多め",
        mapUrl: "https://maps.google.com/?q=渋谷+カフェ",
        matchScore: { work: 3, quick: 1, chat: 1, short: 1, medium: 2, long: 3, quiet: 3, easy: 1, fancy: 2, date: 1, express: 1, food: 1 }
      },
      {
        id: 2,
        name: "シブヤ・エクスプレスコーヒースタンド",
        area: "渋谷駅直結 徒歩1分",
        rating: 4.1,
        totalSeats: 25,
        seatsDetail: "カウンター15席 / テーブル10席",
        plug: false,
        wifi: true,
        tags: ["駅直結", "サクッと利用", "回転早い"],
        img: "https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?auto=format&fit=crop&w=600&q=80",
        fitReason: "立地抜群！隙間時間の短時間休憩にピッタリ",
        crowdText: "1人客メイン / テイクアウトや短時間利用が多め",
        mapUrl: "https://maps.google.com/?q=渋谷+コーヒースタンド",
        matchScore: { work: 1, quick: 3, chat: 1, short: 3, medium: 1, long: 0, quiet: 1, easy: 3, fancy: 1, date: 0, express: 3, food: 1 }
      },
      {
        id: 3,
        name: "グリーンガーデン カフェ＆ダイニング",
        area: "渋谷駅 徒歩5分",
        rating: 4.6,
        totalSeats: 80,
        seatsDetail: "テーブル60席 / テラス20席",
        plug: false,
        wifi: true,
        tags: ["おしゃれ", "ソファー席あり", "会話弾む"],
        img: "https://images.unsplash.com/photo-1442512595331-e89e73853f31?auto=format&fit=crop&w=600&q=80",
        fitReason: "開放的な雰囲気で、友達ともデートでも会話が弾む",
        crowdText: "グループ・カップル利用多め / 明るく賑やかな店内",
        mapUrl: "https://maps.google.com/?q=渋谷+ガーデンカフェ",
        matchScore: { work: 1, quick: 1, chat: 3, short: 1, medium: 3, long: 2, quiet: 1, easy: 2, fancy: 3, date: 3, express: 0, food: 3 }
      },
      {
        id: 4,
        name: "サイレント・ライブラリーラウンジ",
        area: "渋谷駅 徒歩6分",
        rating: 4.5,
        totalSeats: 45,
        seatsDetail: "全席個室風セパレート席",
        plug: true,
        wifi: true,
        tags: ["超静か", "完全全席電源", "長居OK"],
        img: "https://images.unsplash.com/photo-1521017432531-fbd92d768814?auto=format&fit=crop&w=600&q=80",
        fitReason: "図書館のような静けさでじっくり作業可能",
        crowdText: "ほぼ全員が1人客 / 会話のない、とても静かな空間",
        mapUrl: "https://maps.google.com/?q=渋谷+コワーキング",
        matchScore: { work: 3, quick: 0, chat: 0, short: 0, medium: 2, long: 3, quiet: 3, easy: 1, fancy: 2, date: 0, express: 0, food: 0 }
      },
      {
        id: 5,
        name: "サンライズ・ロースターズ",
        area: "渋谷駅 徒歩4分",
        rating: 4.3,
        totalSeats: 95,
        seatsDetail: "カウンター35席 / テーブル60席",
        plug: true,
        wifi: true,
        tags: ["大容量席数", "手軽", "広々店内"],
        img: "https://images.unsplash.com/photo-1453614512568-c4024d13c247?auto=format&fit=crop&w=600&q=80",
        fitReason: "席数が多くいつでもスッと入れる万能カフェ",
        crowdText: "幅広い客層 / 1人作業から打ち合わせまで多様",
        mapUrl: "https://maps.google.com/?q=渋谷+ロースターズ",
        matchScore: { work: 2, quick: 2, chat: 2, short: 2, medium: 2, long: 2, quiet: 2, easy: 3, fancy: 1, date: 1, express: 2, food: 2 }
      },
      {
        id: 6,
        name: "ボタニカル・ボウル＆カフェ",
        area: "渋谷駅 徒歩7分",
        rating: 4.7,
        totalSeats: 50,
        seatsDetail: "テーブル40席 / カウンター10席",
        plug: true,
        wifi: true,
        tags: ["映えスイーツ", "インテリアこだわり", "人気店"],
        img: "https://images.unsplash.com/photo-1559925393-8be0ec4767c8?auto=format&fit=crop&w=600&q=80",
        fitReason: "緑あふれる内装で気分を上げたい時にぴったり",
        crowdText: "女性客・カップル中心 / 落ち着いたおしゃれなBGM",
        mapUrl: "https://maps.google.com/?q=渋谷+ボタニカルカフェ",
        matchScore: { work: 2, quick: 1, chat: 3, short: 1, medium: 3, long: 2, quiet: 2, easy: 1, fancy: 3, date: 3, express: 1, food: 3 }
      }
    ];

    // --- State & Persistence ---
    let currentStep = 0;
    let answers = {};
    let currentSortedCafes = [];
    let activeSortType = 'recommend';

    // DOM Elements
    const qContainer = document.getElementById('question-container');
    const rContainer = document.getElementById('result-container');
    const qTitle = document.getElementById('question-title');
    const qSub = document.getElementById('question-sub');
    const optionsGrid = document.getElementById('options-grid');
    const stepText = document.getElementById('step-text');
    const cafeList = document.getElementById('cafe-list');
    const modal = document.getElementById('modal');

    // --- Init & Session Restore ---
    window.addEventListener('DOMContentLoaded', () => {
      // Modal backdrop click listener
      modal.addEventListener('click', closeModal);

      const savedState = sessionStorage.getItem('kyocafe_state');
      if (savedState) {
        try {
          const parsed = JSON.parse(savedState);
          currentStep = parsed.currentStep || 0;
          answers = parsed.answers || {};
          activeSortType = parsed.activeSortType || 'recommend';

          if (parsed.isFinished) {
            showResults(false);
            return;
          }
        } catch (e) {
          console.error("Failed to restore session state", e);
        }
      }
      renderQuestion();
    });

    function saveState(isFinished = false) {
      const stateObj = {
        currentStep,
        answers,
        activeSortType,
        isFinished
      };
      sessionStorage.setItem('kyocafe_state', JSON.stringify(stateObj));
    }

    function renderQuestion() {
      const q = questions[currentStep];
      qTitle.textContent = q.title;
      qSub.textContent = q.sub;
      stepText.textContent = `質問 ${currentStep + 1} / 3`;
      document.getElementById('btn-prev').classList.toggle('hidden', currentStep === 0);

      for (let i = 1; i <= 3; i++) {
        const dot = document.getElementById(`dot-${i}`);
        if (i <= currentStep + 1) {
          dot.className = "w-3 h-3 rounded-full bg-amber-600 transition-all";
        } else {
          dot.className = "w-3 h-3 rounded-full bg-slate-200 transition-all";
        }
      }

      optionsGrid.innerHTML = '';
      q.options.forEach(opt => {
        const btn = document.createElement('button');
        // 戻ってきたときは前回選んだ選択肢を強調する
        const picked = answers[q.id] === opt.value;
        btn.className = (picked ? "ring-2 ring-amber-500 " : "") + "w-full bg-amber-50/40 hover:bg-amber-100/60 border border-amber-200/60 text-slate-800 font-medium py-4 px-5 rounded-xl flex items-center justify-between text-left transition-all active:scale-[0.99]";
        btn.innerHTML = `
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-lg bg-amber-100 text-amber-800 flex items-center justify-center text-sm">
              <i class="fa-solid ${opt.icon}"></i>
            </div>
            <span class="text-sm font-bold text-slate-700">${opt.label}</span>
          </div>
          <i class="fa-solid fa-chevron-right text-slate-300 text-xs"></i>
        `;
        btn.onclick = () => selectOption(q.id, opt.value);
        optionsGrid.appendChild(btn);
      });
    }

    function selectOption(qId, val) {
      answers[qId] = val;
      if (currentStep < questions.length - 1) {
        currentStep++;
        saveState(false);
        qContainer.classList.remove('fade-in');
        void qContainer.offsetWidth;
        qContainer.classList.add('fade-in');
        renderQuestion();
      } else {
        saveState(true);
        showResults(true);
      }
    }

    function goBack() {
      if (currentStep === 0) return;
      currentStep--;
      saveState(false);
      qContainer.classList.remove('fade-in');
      void qContainer.offsetWidth;
      qContainer.classList.add('fade-in');
      renderQuestion();
    }

    function showResults(shouldSave = true) {
      document.getElementById('step-indicator').classList.add('hidden');
      qContainer.classList.add('hidden');
      rContainer.classList.remove('hidden');

      // スコア計算 (Q1, Q2, Q3すべて反映)
      const scored = cafes.map(c => {
        let score = 0;
        if (answers.purpose && c.matchScore[answers.purpose] !== undefined) {
          score += c.matchScore[answers.purpose];
        }
        if (answers.time && c.matchScore[answers.time] !== undefined) {
          score += c.matchScore[answers.time];
        }
        if (answers.atmosphere && c.matchScore[answers.atmosphere] !== undefined) {
          score += c.matchScore[answers.atmosphere];
        }
        return { ...c, totalScore: score };
      });

      // おすすめ度で上位3件に絞ってから、その3件の中で並び替える
      scored.sort((a, b) => b.totalScore - a.totalScore || b.rating - a.rating);
      currentSortedCafes = scored.slice(0, 3);
      sortResults(activeSortType, false);

      if (shouldSave) {
        saveState(true);
      }
    }

    function sortResults(type, shouldSave = true) {
      activeSortType = type;
      if (shouldSave) saveState(true);

      ['recommend', 'rating', 'seats'].forEach(t => {
        const btn = document.getElementById(`sort-${t}`);
        if (t === type) {
          btn.className = "px-2.5 py-1 rounded-lg font-medium bg-amber-100 text-amber-900 transition-all whitespace-nowrap";
        } else {
          btn.className = "px-2.5 py-1 rounded-lg font-medium text-slate-600 hover:bg-slate-100 transition-all whitespace-nowrap";
        }
      });

      if (type === 'recommend') {
        currentSortedCafes.sort((a, b) => b.totalScore - a.totalScore || b.rating - a.rating);
      } else if (type === 'rating') {
        currentSortedCafes.sort((a, b) => b.rating - a.rating);
      } else if (type === 'seats') {
        currentSortedCafes.sort((a, b) => b.totalSeats - a.totalSeats);
      }

      renderCafeCards(currentSortedCafes);
    }

    function renderCafeCards(list) {
      cafeList.innerHTML = '';
      list.forEach((cafe, idx) => {
        const card = document.createElement('div');
        card.className = "bg-white rounded-2xl overflow-hidden border border-amber-100 shadow-sm hover:shadow-md transition-all";
        card.innerHTML = `
          <div class="relative h-36 bg-slate-100">
            <img src="${cafe.img}" alt="${cafe.name}" class="w-full h-full object-cover">
            <div class="absolute top-2 left-2 bg-amber-800/90 text-white text-[11px] font-bold px-2.5 py-1 rounded-lg backdrop-blur-sm">
              No.${idx + 1}
            </div>
            <div class="absolute top-2 right-2 bg-white/90 text-amber-800 text-xs font-bold px-2 py-0.5 rounded-md flex items-center gap-1 backdrop-blur-sm">
              <i class="fa-solid fa-star text-amber-500 text-[10px]"></i> ${cafe.rating}
            </div>
          </div>
          <div class="p-4">
            <div class="mb-2">
              <span class="inline-block bg-amber-50 border border-amber-200 text-amber-800 text-[11px] font-bold px-2 py-0.5 rounded-md mb-1.5">
                <i class="fa-solid fa-thumbs-up text-[10px] me-1"></i>${cafe.fitReason}
              </span>
              <h3 class="font-bold text-slate-800 text-base leading-snug">${cafe.name}</h3>
              <p class="text-xs text-slate-500 mt-0.5"><i class="fa-solid fa-location-dot me-1 text-slate-400"></i>${cafe.area}</p>
            </div>

            <div class="flex items-center gap-3 text-xs text-slate-600 bg-slate-50 p-2 rounded-lg my-2">
              <span><i class="fa-solid fa-chair text-slate-400 me-1"></i>席数: <strong>${cafe.totalSeats}席</strong></span>
              <span><i class="fa-solid fa-plug text-slate-400 me-1"></i>電源: ${cafe.plug ? 'あり' : 'なし'}</span>
              <span><i class="fa-solid fa-wifi text-slate-400 me-1"></i>Wi-Fi: ${cafe.wifi ? 'あり' : 'なし'}</span>
            </div>

            <div class="flex items-center justify-between pt-2 border-t border-slate-100 mt-2">
              <button onclick="openModal(${cafe.id})" class="text-xs font-bold text-amber-700 hover:text-amber-800 flex items-center gap-1">
                詳細を見る <i class="fa-solid fa-arrow-right text-[10px]"></i>
              </button>
              <a href="${cafe.mapUrl}" target="_blank" rel="noopener noreferrer" class="bg-amber-700 hover:bg-amber-800 text-white text-xs font-bold px-3 py-1.5 rounded-xl flex items-center gap-1 transition-all">
                <i class="fa-solid fa-map-location-dot"></i> Map
              </a>
            </div>
          </div>
        `;
        cafeList.appendChild(card);
      });
    }

    function openModal(cafeId) {
      const cafe = cafes.find(c => c.id === cafeId);
      if (!cafe) return;

      const mContent = document.getElementById('modal-content');
      mContent.innerHTML = `
        <button onclick="closeModal()" class="absolute top-4 right-4 w-8 h-8 bg-slate-100 text-slate-500 rounded-full flex items-center justify-center hover:bg-slate-200">
          <i class="fa-solid fa-xmark"></i>
        </button>
        <div class="mb-4">
          <span class="text-xs font-bold text-amber-700 bg-amber-50 px-2.5 py-1 rounded-full">店舗詳細</span>
          <h3 class="text-lg font-bold text-slate-800 mt-2">${cafe.name}</h3>
          <p class="text-xs text-slate-500"><i class="fa-solid fa-location-dot me-1"></i>${cafe.area}</p>
        </div>

        <div class="space-y-3 border-t border-b border-slate-100 py-3 mb-4 text-xs">
          <div>
            <span class="text-slate-400 block mb-0.5">特徴・設備</span>
            <div class="flex flex-wrap gap-1">
              ${cafe.tags.map(t => `<span class="bg-slate-100 text-slate-700 px-2 py-0.5 rounded">${t}</span>`).join('')}
            </div>
          </div>
          <div>
            <span class="text-slate-400 block mb-0.5">席の構成</span>
            <p class="font-medium text-slate-700">${cafe.seatsDetail}（合計 ${cafe.totalSeats}席）</p>
          </div>
          <div>
            <span class="text-slate-400 block mb-0.5">店内の構造・客層の目安</span>
            <p class="font-medium text-slate-700">${cafe.crowdText}</p>
          </div>
        </div>

        <a href="${cafe.mapUrl}" target="_blank" rel="noopener noreferrer" class="w-full bg-amber-700 hover:bg-amber-800 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 text-sm">
          <i class="fa-solid fa-map-location-dot"></i> Googleマップを開く
        </a>
      `;
      modal.classList.remove('hidden');
    }

    function closeModal() {
      modal.classList.add('hidden');
    }

    function resetQuiz() {
      sessionStorage.removeItem('kyocafe_state');
      currentStep = 0;
      answers = {};
      activeSortType = 'recommend';
      rContainer.classList.add('hidden');
      document.getElementById('step-indicator').classList.remove('hidden');
      qContainer.classList.remove('hidden');
      renderQuestion();
    }
  </script>
</body>
</html>
