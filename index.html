<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>きょうのカフェ診断</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: 1カラムのモバイルアプリ。上から質問→結果→ボトムシート詳細。最大幅 480px で中央寄せ */
:root {
  --bg: #F2F3EF;          /* 冷たい紙のような下地 */
  --surface: #FFFFFF;
  --ink: #1E2421;         /* 本文 */
  --ink-soft: #5E6862;    /* 補足 */
  --line: #DCE0DA;
  --accent: #1F5C4F;      /* 深い緑（焙煎前の豆の色） */
  --accent-ink: #FFFFFF;
  --accent-soft: #E1ECE7;
  --amber: #B66A1F;       /* 評価・ピーク */
  --scrim: rgba(18, 22, 20, .45);
  --shadow: 0 1px 2px rgba(20,30,25,.06), 0 8px 24px rgba(20,30,25,.08);

  --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Noto Sans JP", sans-serif;
  --font-body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --font-data: "DM Mono", ui-monospace, "SFMono-Regular", monospace;

  --r-sm: 10px;
  --r-md: 16px;
  --r-lg: 22px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141816; --surface: #1D2320; --ink: #E8ECE9; --ink-soft: #9DA8A2; --line: #2F3833;
    --accent: #6FBFA8; --accent-ink: #0E1A16; --accent-soft: #23352F; --amber: #E3A15A;
    --scrim: rgba(0,0,0,.6); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141816; --surface: #1D2320; --ink: #E8ECE9; --ink-soft: #9DA8A2; --line: #2F3833;
  --accent: #6FBFA8; --accent-ink: #0E1A16; --accent-soft: #23352F; --amber: #E3A15A;
  --scrim: rgba(0,0,0,.6); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); }
body { margin: 0; font-family: var(--font-body); font-size: 15px; line-height: 1.7; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { max-width: 480px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 120px; }

/* Header */
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { flex: none; color: var(--accent); }
.brand-name { font-family: var(--font-display); font-weight: 900; font-size: 18px; letter-spacing: .02em; }
.lead { margin: 18px 0 4px; font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.35; text-wrap: balance; }
.sub { margin: 0; color: var(--ink-soft); font-size: 13px; }

/* Questions */
.questions { display: grid; gap: 28px; margin-top: 28px; }
.q-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
.q-num { font-family: var(--font-data); font-size: 12px; color: var(--accent); letter-spacing: .08em; }
.q-title { margin: 0; font-size: 16px; font-weight: 700; }
.options { display: grid; gap: 8px; }
.opt {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  padding: 12px 14px; border: 1.5px solid var(--line); border-radius: var(--r-md);
  background: var(--surface); cursor: pointer; transition: border-color .15s, background .15s, transform .1s;
}
.opt:active { transform: scale(.985); }
.opt-icon { flex: none; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--bg); color: var(--ink-soft); transition: background .15s, color .15s; }
.opt-text { display: grid; min-width: 0; }
.opt-label { font-weight: 700; font-size: 15px; line-height: 1.4; }
.opt-hint { font-size: 12px; color: var(--ink-soft); line-height: 1.5; }
.opt-check { margin-left: auto; flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; color: transparent; transition: all .15s; }
.opt[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opt[aria-checked="true"] .opt-icon { background: var(--accent); color: var(--accent-ink); }
.opt[aria-checked="true"] .opt-check { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* Bottom action bar */
.action-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to top, var(--bg) 70%, transparent);
}
.action-inner { max-width: 448px; margin: 0 auto; display: grid; gap: 6px; }
.progress { display: flex; justify-content: center; gap: 6px; }
.progress span { width: 22px; height: 4px; border-radius: 2px; background: var(--line); transition: background .2s; }
.progress span.on { background: var(--accent); }
.btn-primary {
  width: 100%; padding: 15px; border: 0; border-radius: 999px; cursor: pointer;
  background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 16px;
  box-shadow: var(--shadow); transition: opacity .15s, transform .1s;
}
.btn-primary:active { transform: scale(.98); }
.btn-primary:disabled { opacity: .35; cursor: not-allowed; box-shadow: none; }

/* Results */
.result-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.btn-ghost { display: inline-flex; align-items: center; gap: 4px; padding: 8px 12px; border: 1.5px solid var(--line); border-radius: 999px; background: var(--surface); cursor: pointer; font-size: 13px; font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.chip { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.cards { display: grid; gap: 16px; margin-top: 22px; }
.card {
  display: block; width: 100%; padding: 0; text-align: left; border: 0; cursor: pointer;
  background: var(--surface); border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--shadow);
  animation: rise .45s cubic-bezier(.2,.7,.2,1) both;
  transition: transform .15s;
}
.card:active { transform: scale(.985); }
@keyframes rise { from { transform: translateY(14px); opacity: .001; } to { transform: none; opacity: 1; } }
.photo { position: relative; aspect-ratio: 16 / 9; max-width: 100%; overflow: hidden; }
.photo svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.rank { position: absolute; top: 12px; left: 12px; padding: 3px 10px; border-radius: 999px; background: rgba(255,255,255,.92); color: #1E2421; font-family: var(--font-data); font-size: 12px; font-weight: 500; }
.fit { justify-self: start; padding: 4px 10px; border-radius: var(--r-sm); background: var(--accent-soft); color: var(--accent); font-size: 12.5px; font-weight: 700; line-height: 1.5; }
.dummy-label { position: absolute; bottom: 8px; right: 12px; font-size: 10px; color: rgba(255,255,255,.75); letter-spacing: .1em; }
.card-body { padding: 14px 16px 16px; display: grid; gap: 6px; }
.card-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.card-name { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 19px; line-height: 1.35; min-width: 0; }
.rating { flex: none; display: inline-flex; align-items: baseline; gap: 4px; color: var(--amber); font-weight: 700; }
.rating span { font-family: var(--font-data); font-size: 15px; }
.rating small { color: var(--ink-soft); font-weight: 400; font-size: 11px; font-family: var(--font-data); }
.meta { font-size: 12px; color: var(--ink-soft); }
.meta svg { vertical-align: -2px; }
.pitch { display: flex; gap: 8px; align-items: flex-start; margin-top: 4px; padding: 10px 12px; border-radius: var(--r-sm); background: var(--bg); font-size: 13.5px; font-weight: 500; line-height: 1.55; }
.pitch svg { flex: none; margin-top: 2px; color: var(--accent); }
.tap-hint { font-size: 12px; color: var(--accent); font-weight: 500; text-align: right; }
.note { margin-top: 24px; font-size: 11.5px; color: var(--ink-soft); text-align: center; }

/* Modal (bottom sheet) */
.sheet-wrap { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; background: var(--scrim); animation: fade .2s both; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.sheet {
  width: 100%; max-width: 480px; max-height: 88%; overflow-y: auto;
  background: var(--surface); border-radius: var(--r-lg) var(--r-lg) 0 0;
  padding: 10px 20px calc(20px + env(safe-area-inset-bottom, 0px));
  animation: up .28s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes up { from { transform: translateY(40px); } to { transform: none; } }
@media (min-width: 560px) { .sheet-wrap { align-items: center; } .sheet { border-radius: var(--r-lg); } }
.grabber { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 12px; }
.sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.sheet-title { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.35; }
.btn-close { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--bg); cursor: pointer; display: grid; place-items: center; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0; }
.fact { padding: 12px; border-radius: var(--r-md); background: var(--bg); display: grid; gap: 2px; }
.fact-label { font-size: 11px; color: var(--ink-soft); letter-spacing: .06em; display: flex; align-items: center; gap: 6px; }
.fact-value { font-weight: 700; font-size: 15px; }
.fact-sub { font-size: 11.5px; color: var(--ink-soft); line-height: 1.4; }
.fact.wide { grid-column: 1 / -1; }
.ok { color: var(--accent); }
.ng { color: var(--ink-soft); }
.section-label { margin: 18px 0 8px; font-size: 13px; font-weight: 700; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.section-label span { font-weight: 400; color: var(--amber); font-size: 12px; }
.crowd { display: grid; grid-template-columns: repeat(13, 1fr); align-items: end; gap: 4px; height: 76px; }
.crowd i { display: block; border-radius: 4px 4px 2px 2px; background: var(--accent-soft); min-height: 4px; }
.crowd i.peak { background: var(--amber); }
.crowd-axis { display: grid; grid-template-columns: repeat(13, 1fr); gap: 4px; margin-top: 4px; font-family: var(--font-data); font-size: 10px; color: var(--ink-soft); text-align: center; font-variant-numeric: tabular-nums; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-soft); }
.btn-map {
  margin-top: 20px; display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 14px; border-radius: 999px; text-decoration: none;
  background: var(--accent); color: var(--accent-ink); font-weight: 700;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<div class="app">
  <header class="brand">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h12v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9z"/><path d="M16 10h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M8 3.5c0 1.2 1 1.3 1 2.5M12 3.5c0 1.2 1 1.3 1 2.5"/></svg>
    <span class="brand-name">きょうのカフェ診断</span>
  </header>

  <!-- STEP 1: 診断フォーム -->
  <main id="step-form">
    <h1 class="lead">3つ選ぶだけで、<br>今日の気分に合う店へ。</h1>
    <p class="sub">口コミを読み比べなくて大丈夫。30秒で3軒に絞ります。</p>
    <div class="questions" id="questions"></div>
  </main>

  <!-- STEP 2: 結果一覧 -->
  <section id="step-result" hidden aria-live="polite">
    <div class="result-top" style="margin-top:20px">
      <h1 class="lead" style="margin:0;font-size:22px">あなたへの3軒</h1>

</div>

<div class="action-bar" id="action-bar">
  <div class="action-inner">
    <div class="progress" id="progress" aria-hidden="true"><span></span><span></span><span></span></div>
    <button class="btn-primary" id="btn-search" type="button" disabled>あと3つ選んでください</button>
  </div>
</div>

<!-- STEP 3: 詳細モーダル -->
<div class="sheet-wrap" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title" id="sheet"></div>
</div>

<script>

const QUESTIONS = [
  { key: 'purpose', title: '今日はどう過ごしたい？', options: [
    { value: 'work',  label: 'ガッツリ作業',     hint: 'PC・勉強で2時間以上いたい', icon: 'laptop' },

  { key: 'vibe', title: 'どんな雰囲気がいい？', options: [

    { value: 'lively', label: '男女半々・ほどよく賑やか', hint: '話し声があるほうが落ち着く', icon: 'users' },
    { value: 'stylish',label: 'おしゃれ・カップル多め',   hint: '内装や器にこだわりたい', icon: 'sparkle' },
  ]},
  { key: 'drink', title: '何を飲みたい・食べたい？', options: [
    { value: 'coffee', label: 'コーヒー',         hint: 'ハンドドリップ・浅煎りなど', icon: 'bean' },

];

    pitch: { work: '平日午前なら静か。窓際のみ電源あり', quick: '人気店なので平日の開店直後が狙い目', chat: '吹き抜けの明るい店内。フレンチトーストを分け合いながら' },
    fit: { work: '平日午前の静けさ', quick: '開店直後の空き', chat: '吹き抜けの明るさ' } },

/* ---------- 状態 ---------- */
const state = { purpose: null, vibe: null, drink: null };
const $ = (id) => document.getElementById(id);

/* ---------- STEP 1: フォーム描画 ---------- */
function renderQuestions() {
  $('questions').innerHTML = QUESTIONS.map((q, qi) => `
    <section>
      <div class="q-head"><span class="q-num">Q${qi + 1}/3</span><h2 class="q-title" id="q-${q.key}">${q.title}</h2></div>
      <div class="options" role="radiogroup" aria-labelledby="q-${q.key}">
        ${q.options.map(o => `
          <button type="button" class="opt" role="radio" id="opt-${q.key}-${o.value}"
            data-key="${q.key}" data-value="${o.value}" aria-checked="${state[q.key] === o.value}">
            <span class="opt-icon">${icon(o.icon, 22)}</span>
            <span class="opt-text"><span class="opt-label">${o.label}</span><span class="opt-hint">${o.hint}</span></span>
            <span class="opt-check">${icon('check', 14, 3)}</span>
          </button>`).join('')}
      </div>
    </section>`).join('');
}

function updateForm() {
  document.querySelectorAll('.opt').forEach(el => {
    el.setAttribute('aria-checked', state[el.dataset.key] === el.dataset.value);
  });
  const done = Object.values(state).filter(Boolean).length;
  [...$('progress').children].forEach((s, i) => s.classList.toggle('on', i < done));
  const btn = $('btn-search');
  btn.disabled = done < 3;
  btn.textContent = done < 3 ? `あと${3 - done}つ選んでください` : 'おすすめカフェを探す';
}

$('questions').addEventListener('click', (e) => {
  const opt = e.target.closest('.opt');
  if (!opt) return;
  const { key, value } = opt.dataset;
  state[key] = value;
  updateForm();
  // 次の未回答の質問へ自動スクロール（数タップで完結させる）
  const idx = QUESTIONS.findIndex(q => q.key === key);
  const next = QUESTIONS.slice(idx + 1).find(q => !state[q.key]);
  if (next) $('q-' + next.key).scrollIntoView({ behavior: 'smooth', block: 'center' });
});

/* ---------- マッチングロジック ----------
   目的を最重視（×3）、雰囲気（×2）、飲み物（×1.5）で加重スコア → 上位3件
   スコアは並び替えにだけ使い、画面には数値ではなく言葉（fitLine）で理由を出す */
const WEIGHT = { purpose: 3, vibe: 2, drink: 1.5 };

function recommend(s) {
  return CAFES
    .map(c => {
      const total = c.score[s.purpose] * WEIGHT.purpose + c.score[s.vibe] * WEIGHT.vibe + c.score[s.drink] * WEIGHT.drink;
      return { ...c, total };
    })
    .sort((a, b) => b.total - a.total || b.rating - a.rating)
    .slice(0, 3);
}

/* 「なぜこの店か」を一言で。目的との相性の強さで言い回しを変える */
const FIT_PREFIX = { work: '作業重視のあなたに', quick: 'サクッと派のあなたに', chat: 'おしゃべり派のあなたに' };
function fitLine(c, s) {
  const word = c.fit[s.purpose];
  const level = c.score[s.purpose];
  if (level >= 3) return `${FIT_PREFIX[s.purpose]}『${word}』が最適`;
  if (level === 2) return `${FIT_PREFIX[s.purpose]}『${word}』がちょうどいい`;
  return `雰囲気で選ぶなら『${word}』が魅力`;
}

/* ---------- 写真ダミー（店ごとに色相を変えたイラスト） ---------- */
function photo(c) {
  const h = c.hue;
  return `<svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs><linearGradient id="g${c.id}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="hsl(${h} 38% 72%)"/><stop offset="1" stop-color="hsl(${(h + 25) % 360} 30% 44%)"/>
    </linearGradient></defs>
    <rect width="320" height="180" fill="url(#g${c.id})"/>
    <rect x="0" y="122" width="320" height="58" fill="hsl(${h} 25% 30% / .35)"/>
    <rect x="210" y="30" width="70" height="70" rx="6" fill="hsl(${h} 60% 92% / .35)"/>
    <line x1="245" y1="30" x2="245" y2="100" stroke="hsl(${h} 40% 30% / .3)" stroke-width="3"/>
    <line x1="210" y1="65" x2="280" y2="65" stroke="hsl(${h} 40% 30% / .3)" stroke-width="3"/>
    <ellipse cx="120" cy="124" rx="56" ry="9" fill="hsl(${h} 30% 20% / .25)"/>
    <path d="M86 84h64v22a28 28 0 0 1-28 28h-8a28 28 0 0 1-28-28z" fill="#FBFAF7"/>
    <path d="M150 90h7a12 12 0 0 1 0 24h-9" fill="none" stroke="#FBFAF7" stroke-width="6"/>
    <ellipse cx="118" cy="85" rx="31" ry="5" fill="hsl(28 45% 32%)"/>
    <path d="M106 70c0-7 7-7 7-14M122 70c0-7 7-7 7-14" fill="none" stroke="#FBFAF7" stroke-opacity=".7" stroke-width="3" stroke-linecap="round"/>
  </svg>`;
}

/* ---------- STEP 2: 結果描画 ---------- */
const labelOf = (key) => QUESTIONS.find(q => q.key === key).options.find(o => o.value === state[key]).label;
let current = [];

function showResults() {
  current = recommend(state);
  $('chips').innerHTML = QUESTIONS.map(q => `<span class="chip">${labelOf(q.key)}</span>`).join('');
  $('cards').innerHTML = current.map((c, i) => `
    <button type="button" class="card" data-id="${c.id}" style="animation-delay:${i * 90}ms" aria-label="${c.name}の詳細を見る">
      <div class="photo">${photo(c)}
        <span class="rank">No.${i + 1}</span>
        <span class="dummy-label">PHOTO DUMMY</span>
      </div>
      <div class="card-body">
        <span class="fit">${fitLine(c, state)}</span>
        <div class="card-row">
          <h2 class="card-name">${c.name}</h2>
          <span class="rating">${icon('star', 15)}<span>${c.rating.toFixed(1)}</span><small>(${c.reviews})</small></span>
        </div>
        <div class="meta">${c.area}駅 徒歩${c.walk}分 ・ ${c.price}</div>
        <div class="meta">${icon('users', 13)} ${c.crowdText}</div>
        <div class="pitch">${icon('check', 16, 2.4)}<span>${c.pitch[state.purpose]}</span></div>
        <div class="tap-hint">タップで詳細 →</div>
      </div>
    </button>`).join('');
  $('step-form').hidden = true;
  $('action-bar').hidden = true;
  $('step-result').hidden = false;
  window.scrollTo({ top: 0 });
}

$('btn-search').addEventListener('click', showResults);
$('btn-back').addEventListener('click', () => {
  $('step-result').hidden = true;
  $('step-form').hidden = false;
  $('action-bar').hidden = false;
  window.scrollTo({ top: 0 });
});
$('cards').addEventListener('click', (e) => {
  const card = e.target.closest('.card');
  if (card) openModal(Number(card.dataset.id), card);
});

/* ---------- STEP 3: 詳細モーダル ---------- */
let lastFocus = null;
function openModal(id, trigger) {
  const c = current.find(x => x.id === id);
  lastFocus = trigger;
  const max = Math.max(...c.crowd);
  const outletOk = c.outlet !== 'なし';
  const mapUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(`${c.name} ${c.area}`);
  $('sheet').innerHTML = `
    <div class="grabber"></div>
    <div class="sheet-head">
      <div>
        <h2 class="sheet-title" id="modal-title">${c.name}</h2>
        <div class="meta">${c.area}駅 徒歩${c.walk}分 ・ ${c.price} ・ <span style="color:var(--amber);font-weight:700">★ ${c.rating.toFixed(1)}</span></div>
      </div>
      <button type="button" class="btn-close" id="btn-close" aria-label="閉じる">${icon('close', 18, 2.2)}</button>
    </div>

    <div class="facts">
      <div class="fact wide">
        <span class="fact-label">${icon('users', 14)}客層・席</span>
        <span class="fact-value">${c.crowdText}</span>
      </div>
      <div class="fact">
        <span class="fact-label">${icon('plug', 14)}コンセント</span>
        <span class="fact-value ${outletOk ? 'ok' : 'ng'}">${outletOk ? 'あり（' + c.outlet + '）' : 'なし'}</span>
        <span class="fact-sub">${c.outlet === '全席' ? '全席に電源あり' : c.outlet === '一部' ? '窓際・カウンターのみ' : '充電は事前に'}</span>
      </div>
      <div class="fact">
        <span class="fact-label">${icon('wifi', 14)}Wi-Fi</span>
        <span class="fact-value ${c.wifi ? 'ok' : 'ng'}">${c.wifi ? 'あり' : 'なし'}</span>
        <span class="fact-sub">${c.wifi ? c.wifiNote : 'テザリング推奨'}</span>
      </div>
    </div>

    <div class="section-label">${'混雑しやすい時間帯'}<span>ピーク：${c.peak}</span></div>
    <div class="crowd" role="img" aria-label="混雑の目安。ピークは${c.peak}">
      ${c.crowd.map(v => `<i class="${v === max ? 'peak' : ''}" style="height:${Math.max(v, 4)}%"></i>`).join('')}
    </div>
    <div class="crowd-axis">${c.crowd.map((_, i) => `<span>${(i % 2 === 0) ? 8 + i : ''}</span>`).join('')}</div>

    <div class="section-label">こんな人に</div>
    <span class="fit" style="display:inline-block;margin-bottom:8px">${fitLine(c, state)}</span>
    <div class="pitch" style="margin-top:0">${icon('check', 16, 2.4)}<span>${c.pitch[state.purpose]}</span></div>
    <div class="tags" style="margin-top:12px">${c.tags.map(t => `<span class="tag">#${t}</span>`).join('')}</div>

    <a class="btn-map" href="${mapUrl}" target="_blank" rel="noopener">${icon('pin', 18, 2)}Googleマップで開く</a>
  `;
  $('modal').hidden = false;
  document.body.style.overflow = 'hidden';
  $('btn-close').focus();
}
function closeModal() {
  $('modal').hidden = true;
  document.body.style.overflow = '';
  if (lastFocus) lastFocus.focus();
}
$('modal').addEventListener('click', (e) => {
  if (e.target.id === 'modal' || e.target.closest('#btn-close')) closeModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !$('modal').hidden) closeModal();
});

/* ---------- 起動 ---------- */
renderQuestions();
updateForm();
</script>
